  components:
  - type: Sprite
    sprite: _Art/Objects/Specific/Engineering/material_bag.rsi
    state: icon
  - type: Clothing
    sprite: _Art/Objects/Specific/Engineering/material_bag.rsi
    quickEquip: false
    slots:
    - belt
  - type: Storage
    maxItemSize: Normal
    grid:
    - 0,0,9,3
    quickInsert: true
    areaInsert: true
    whitelist:
      tags:
        - ConstructionMaterial
