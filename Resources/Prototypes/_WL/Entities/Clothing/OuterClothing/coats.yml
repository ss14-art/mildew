- type: entity
  parent: ClothingOuterStorageFoldableBase
  id: ClothingOuterEngiCoat
  name: engineer coat
  description: The perfect uniform for an experiment with singularity on an april night.
  components:
  - type: Sprite
    sprite: _WL/Clothing/OuterClothing/Coats/engicoat.rsi
  - type: Clothing
    sprite: _WL/Clothing/OuterClothing/Coats/engicoat.rsi
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.90
        Radiation: 0.90
        Caustic: 0.75

